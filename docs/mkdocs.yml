site_name: pyNMMS
site_description: An automated reasoner for the Non-Monotonic Multi-Succedent (NMMS) propositional sequent calculus
site_url: https://bradleypallen.github.io/pyNMMS/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["../src"]
          options:
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorial:
      - Key Concepts: tutorial/concepts.md
      - Material Bases: tutorial/material-bases.md
      - Proof Search: tutorial/proof-search.md
      - CLI Usage: tutorial/cli-usage.md
      - "Chapter 3 Walkthrough": tutorial/chapter3-walkthrough.md
      - Ontology Extension: tutorial/onto-tutorial.md
      - Reasoning over RDF: tutorial/rdf-tutorial.md
  - API Reference:
      - MaterialBase: api/base.md
      - NMMSReasoner: api/reasoner.md
      - Syntax: api/syntax.md
      - Sequent and AtomSet: api/sequent.md
      - Robustness: api/robustness.md
      - RDF Atoms: api/rdf-atoms.md
      - RDF Graph View: api/rdf-view.md
      - RDF Bases: api/rdf-base.md
      - RDF Positions: api/rdf-position.md
      - RDF Rules and Regimes: api/rdf-rules.md
      - RDF Closure: api/rdf-closure.md
      - RDF Backends: api/rdf-backends.md
      - RDF Converters: api/rdf-convert.md
      - Ontology Material Base: api/onto-base.md
      - Ontology Syntax: api/onto-syntax.md
  - Theory:
      - NMMS Calculus: theory/nmms-calculus.md
      - Ontology Extension: theory/onto-extension.md
      - RDF Semantics: theory/rdf-semantics.md
      - Querying and Entitlement: theory/querying-and-entitlement.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

docs_dir: docs
